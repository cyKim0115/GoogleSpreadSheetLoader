name: Export Unity Package

# 배포용 GoogleSpreadSheetLoader.unitypackage를 batchmode로 생성합니다.
# Secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (game-ci)
# https://game.ci/docs/github/activation

on:
  workflow_dispatch:
    inputs:
      commit_and_push:
        description: "생성 후 unitypackage를 커밋하고 push"
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  export:
    name: Export .unitypackage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Unity version
        id: unity
        run: |
          VER=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | head -n1 | tr -d '\r')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Unity version: $VER"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-export-${{ steps.unity.outputs.version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-export-${{ steps.unity.outputs.version }}-

      - name: Export via Unity batchmode
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.unity.outputs.version }}
          targetPlatform: StandaloneLinux64
          buildMethod: GoogleSpreadSheetLoader.Export.GSSL_ExportUnityPackage.Export
          allowDirtyBuild: true

      - name: Verify package
        run: |
          test -f GoogleSpreadSheetLoader.unitypackage
          ls -la GoogleSpreadSheetLoader.unitypackage
          if [ -f Logs/gssl-export-unitypackage-result.json ]; then
            cat Logs/gssl-export-unitypackage-result.json
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleSpreadSheetLoader.unitypackage
          path: GoogleSpreadSheetLoader.unitypackage

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: GoogleSpreadSheetLoader.unitypackage

      - name: Commit and push package
        if: github.event_name == 'workflow_dispatch' && inputs.commit_and_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- GoogleSpreadSheetLoader.unitypackage
          if git diff --cached --quiet -- GoogleSpreadSheetLoader.unitypackage; then
            echo "No package changes."
            exit 0
          fi
          git commit -m "리소스 - GoogleSpreadSheetLoader.unitypackage 배치 Export 갱신"
          git push origin HEAD:${{ github.ref_name }}
